[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-alpha-miner"
version = "0.2.0"
description = "A reproducible, family-aware framework for synthetic symbolic alpha search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "gaosu0715-lgtm" }]
keywords = ["evolutionary-computation", "symbolic-regression", "quantitative-finance", "program-synthesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
alpha-miner = "alpha_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/toy_demo.py" = ["I001"]
